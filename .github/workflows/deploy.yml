name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    # The site is the only thing this workflow builds, so a commit that touches
    # nothing under site/ does not need to run it.
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  # Lets a deploy be triggered by hand from the Actions tab.
  workflow_dispatch:

# What the deploy step needs, and nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued runs wait rather than racing, and a run already
# in flight is allowed to finish so a half-published site never goes live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        # This repository is served as a project page, so every link and asset
        # has to carry the repository name. Without it the site loads and every
        # link 404s.
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        # The build also validates every internal link, so a broken link fails
        # the deploy rather than shipping.
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
