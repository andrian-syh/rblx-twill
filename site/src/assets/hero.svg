<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="">
  <!-- PLACEHOLDER for the hero artwork. Replace this file, keeping the name,
       or point `hero.image.file` in src/content/docs/index.mdx somewhere else.

       A twill weave is a diagonal rib produced by offsetting the crossing
       threads by one on each pass. That offset is drawn here. -->
  <defs>
    <linearGradient id="warp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <g stroke="url(#warp)" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M40 200 L160 80"/>
    <path d="M40 280 L240 80"/>
    <path d="M80 320 L320 80"/>
    <path d="M160 360 L360 160"/>
    <path d="M240 360 L360 240"/>
    <path d="M320 360 L360 320"/>
  </g>

  <g stroke="#a8a29e" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.35">
    <path d="M40 120 L120 40"/>
    <path d="M280 360 L360 280"/>
  </g>
</svg>
